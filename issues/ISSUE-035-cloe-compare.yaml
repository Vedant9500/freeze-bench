background: |
  At this commit, the A/B compare detects reloads by polling tab status,
  waits a fixed sleep after an async toggle, reloads through the HTTP
  cache, and applies toggles without verifying applied state. Compare
  numbers therefore mix cache hits, not-yet-applied toggles, and stale-tab
  races.
task: |
  At this commit, demonstrate each race with stubbed browser APIs: (a) a
  reload detector that resolves while the old document still reports its
  status; (b) a fixed sleep after an asynchronously-applied toggle that has
  not taken effect yet; (c) a reload that serves the HTTP cache; (d) two
  rapid toggles where the last writer loses. Locate the responsible code on
  both sides (popup + background) and state the synchronization rule each
  case needs. Cite worktree file:lines.
