background: |
  Scoped file queries misbehave three ways: a missing absolute scope
  starts a walk far above the intended location, a file query with an
  extension also returns renamed variants, and weak substring deep hits
  suppress the remaining jobs.
task: |
  At this commit, why does each of the three symptoms happen? Locate the
  scope-resolution, name-matching, and job-suppression faults with
  file:line citations. State which root gets walked, which names match,
  and which jobs get cancelled.
