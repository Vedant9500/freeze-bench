background: |
  At this commit the estimator optionally fits a second symbolic stage on
  the leftover residual of the first stage. Candidate generation and
  refinement for that stage observe the full dataset, and acceptance
  compares against a holdout overlapping the build data. A bloated
  incumbent can keep its slot against a strictly better screened challenger.
task: |
  Prove the leak: a residual candidate shaped by holdout rows accepted on
  holdout score, and a strictly better screened challenger losing to the
  incumbent. Specify the minimal ordering fix (split relative to
  generation/refinement/judgment) and acceptance rule, with predicted
  benchmark direction. Cite worktree file:lines.
