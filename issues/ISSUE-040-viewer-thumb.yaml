  At this commit, show a hostile file that panics outside the guarded
  decode region and leaves its entry stranded in-flight with permanently
  reduced throughput. Show a transient failure (download finishing, edit
  saving) that never re-queues. Show a test run that modifies the real
  user settings location. Locate the worker body, the in-flight and
  failed sets, and the settings path used by tests. Cite worktree
  file:lines.
