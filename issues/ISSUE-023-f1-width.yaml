difficulty: "medium"
effort_originally: "unknown - open issue at mining time"
background: |
  The training plant decides wall contact from a single half width taken
  at the start straight, while the track model carries per-point widths
  varying by over three meters. The sensor helper already resolves width
  per position, but the rollout and its batched mirror do not use it for
  the wall rule.
task: |
  Place cars at the same lateral offset on a wide section and a narrow
  section and show the plant gives the same alive/dead verdict where the
  survey says they must differ. Propose the minimal fix (which width
  lookup the wall rule must use, fallback consistency) and the
  corner-cut vs false-elimination tradeoff. Cite worktree file:lines.
worktree: "/tmp/eval/ISSUE-023"
