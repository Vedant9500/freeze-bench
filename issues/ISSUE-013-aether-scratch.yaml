effort_originally: "hours-to-days of heap-corruption diagnosis on device (seam + anomalous hot-pixel counts)"
background: |
  The tiled stacker splits each frame into 512-row tiles with a 1-row
  overlap and finalizes per tile through a native kernel using a
  caller-provided scratch buffer. Middle tiles show a dim seam on the
  overlap row and the bad-pixel map fires thousands of times on clean
  input; tile 0 is unaffected.
task: |
  At this commit, why does the overlap row of tiles 1+ go dim while
  tile 0 is unaffected, and why is the bad-pixel array dirty on clean
  input? Locate the root cause with file:line citations. State which
  tiles are affected and why tile 0 escapes.
