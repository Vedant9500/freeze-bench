id: "ISSUE-041"
title: "Pawn-structure cache serves stale scores across king positions"
qtype: "K"
repo: "/mnt/data/lily"
base_commit: "444944445e60a6e5b99b4191d02ccfa36f636e44"
mined_date: "2026-10-09"
