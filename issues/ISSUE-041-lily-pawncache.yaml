mode: "research"
difficulty: "hard"
effort_originally: "days - correctness bug caught by endgame knob test"
background: |
  At this commit the classical eval caches pawn-structure subscores in a
  small direct-mapped table keyed by pawn layout, returning the cached
  triple on hits without recomputation. The same eval also carries
  endgame passer terms that depend on where the kings stand. Two
  positions can share an identical pawn layout while their kings stand
  on different squares.
task: |
  At this commit, explain why back-to-back evals of same-pawns/different-kings
  positions can return identical pawn subscores when they should differ.
  Locate the cache key function and the pawn-structure entry point. Give a
  minimal two-FEN repro (same pawns, kings on different squares, evaluated
  under scoped nonzero king-sensitive weights) with before scores for each
  FEN. Cite worktree file:lines.
worktree: "/tmp/eval/ISSUE-041"
